<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtg-rival · mesa</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --txt:#e8e8ec; --dim:#9aa0ad; --acc:#f5a524; --ok:#3fb950; --bad:#f85149; --sel:#2f81f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:18px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header .t { font-weight:600; }
  header .st { margin-left:auto; color:var(--dim); }
  header .st.me { color:var(--acc); font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 300px; gap:10px; padding:10px 14px 230px; }
  .zone { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 10px; margin-bottom:10px; }
  .zone h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); display:flex; gap:14px; align-items:baseline; }
  .zone h3 .life { color:var(--txt); font-size:18px; text-transform:none; letter-spacing:0; }
  .cards { display:flex; flex-wrap:wrap; gap:8px; min-height:40px; align-items:flex-start; }
  .card { position:relative; width:120px; cursor:default; transition:transform .15s; }
  .card img { width:120px; height:168px; border-radius:6px; display:block; background:#222; object-fit:cover; }
  .card .ph { width:120px; height:168px; border-radius:6px; background:#23262e; border:1px solid var(--line); padding:6px; font-size:11px; overflow:hidden; }
  .card .ph b { display:block; margin-bottom:4px; font-size:12px; }
  .card.tapped { transform:rotate(90deg) translateY(-24px); margin:0 24px 0 24px; }
  .card .pt { position:absolute; right:4px; bottom:4px; background:#000c; padding:1px 6px; border-radius:4px; font-weight:700; font-size:13px; }
  .card .badge { position:absolute; left:4px; top:4px; background:#000c; padding:1px 5px; border-radius:4px; font-size:10px; color:var(--acc); }
  .card.opt { cursor:pointer; outline:3px solid var(--acc); outline-offset:1px; }
  .card.opt.sel { outline-color:var(--sel); box-shadow:0 0 0 6px #2f81f766; }
  .card.attacking { outline:3px solid var(--bad); }
  button.auto { background:#23262e; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button.auto.on { color:var(--acc); border-color:var(--acc); }
  .card .tip { display:none; position:absolute; z-index:20; left:124px; top:0; width:260px; background:#000e; color:#fff; padding:8px; border-radius:6px; font-size:12px; white-space:pre-wrap; }
  .card:hover .tip { display:block; }
  .small { color:var(--dim); font-size:12px; }
  .pile { display:inline-block; margin-right:12px; cursor:pointer; }
  .pile:hover { color:var(--acc); }
  #log { font-size:12px; color:var(--dim); max-height:60vh; overflow:auto; }
  #log div { padding:2px 0; border-bottom:1px dashed #22262f; }
  #log div.me { color:var(--txt); }
  .stack { border-left:3px solid var(--acc); }
  #decision { position:fixed; left:0; right:0; bottom:0; background:#13161c; border-top:2px solid var(--acc); padding:10px 14px; z-index:10; max-height:45vh; overflow:auto; }
  #decision.idle { border-top-color:var(--line); }
  #decision .prompt { font-size:15px; margin-bottom:8px; }
  #decision .prompt b { color:var(--acc); }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  button { background:#232834; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.sel { background:#1f3a66; border-color:var(--sel); }
  button.pass { border-color:#555; color:#ccc; }
  button.go { background:var(--acc); color:#000; font-weight:700; }
  button.go:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  #err { color:var(--bad); }
  #overlay { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:50; font-size:28px; text-align:center; padding:30px; }
  #overlay.show { display:flex; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px; max-width:640px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <span class="t" id="title">mtg-rival · mesa</span>
  <span id="turn" class="small">—</span>
  <span id="game" class="small"></span>
  <span class="st" id="status">conectando…</span>
</header>
<main>
  <section>
    <div class="zone" id="oppZone">
      <h3>Rival <span class="life" id="oppLife">20</span> <span id="oppCounts" class="small"></span></h3>
      <div class="cards" id="oppBf"></div>
    </div>
    <div class="zone stack" id="stackZone" style="display:none"><h3>Pila (lo último arriba)</h3><div id="stack" class="small"></div></div>
    <div class="zone" id="meZone">
      <h3>Vos <span class="life" id="meLife">20</span> <span id="meCounts" class="small"></span></h3>
      <div class="cards" id="meBf"></div>
    </div>
    <div class="zone"><h3>Tu mano</h3><div class="cards" id="hand"></div></div>
  </section>
  <aside>
    <div class="zone"><h3>Registro</h3><div id="log"></div></div>
  </aside>
</main>
<div id="decision" class="idle">
  <div class="prompt" id="prompt">Esperando la partida…</div>
  <div class="opts" id="opts"></div>
  <div class="row"><button class="go" id="go" style="display:none">Confirmar</button><button id="auto" class="auto" onclick="setAuto(!auto)" title="Pasa automáticamente (también por encima de los disparos del rival); se detiene en tu próxima fase principal, cuando el rival lanza un hechizo o activa algo, y cuando hay que bloquear o elegir">⏭ Pasar hasta mi turno</button><span id="hint" class="small"></span><span id="err"></span></div>
</div>
<div id="overlay"></div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row"><button onclick="document.getElementById('dlg').close()">Cerrar</button></div></dialog>
<script>
const token = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
let cur = null;          // current decision payload
let selected = new Set();
let cards = {};          // name -> oracle info (from the last decision)
let lastLogLen = 0;
let lastAnswered = null;  // rid of the last decision we answered (the server may already have sent the next one)
let auto = null;          // auto-pass armed: { armedTurn } -> pass empty-stack priorities until our next MAIN1 or anything else happens

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function connect() {
  const es = new EventSource(`/events?t=${encodeURIComponent(token)}`);
  es.addEventListener("hello", (e) => { const d = JSON.parse(e.data); $("title").textContent = `mtg-rival · ${d.label}`; setStatus("conectado, esperando…"); });
  es.addEventListener("decision", (e) => showDecision(JSON.parse(e.data)));
  es.addEventListener("waiting", (e) => { const d = JSON.parse(e.data || "{}"); if (!cur || !d.answered || cur.rid === d.answered) { cur = null; idle(auto ? "Pasando hasta tu turno…" : "El rival está jugando…"); } });
  es.addEventListener("game", (e) => {
    const d = JSON.parse(e.data);
    if (d.event === "start") { $("game").textContent = `Partida ${d.game}${d.onThePlay !== undefined ? (d.youPlay ? " · salís vos" : " · sale el rival") : ""}`; $("overlay").classList.remove("show"); }
    if (d.event === "end") { $("overlay").innerHTML = d.youWon ? "🎉 Ganaste la partida" : d.youWon === false ? "Perdiste la partida" : "Empate"; $("overlay").innerHTML += `<div class="small" style="font-size:16px;margin-top:10px">${esc(d.reason || "")} · turno ${esc(d.turns ?? "?")}</div>`; $("overlay").classList.add("show"); }
  });
  es.addEventListener("over", (e) => { const d = JSON.parse(e.data); idle("Match terminado"); $("overlay").innerHTML = `Match terminado: ${esc(d.summary || "")}`; $("overlay").classList.add("show"); });
  es.onerror = () => { setStatus("desconectado, reintentando…"); };
}
function setStatus(s, me) { const el = $("status"); el.textContent = s; el.className = "st" + (me ? " me" : ""); }
function idle(msg) { $("decision").className = "idle"; $("prompt").textContent = msg; $("opts").innerHTML = ""; $("go").style.display = "none"; $("hint").textContent = ""; $("err").textContent = ""; setStatus(msg); }

function autoPassable(d) {
  if (!auto || d.kind !== "priority") return false;
  const st = d.state || {};
  // Triggered abilities on the stack (Vanguard counters, ETB pings) are not worth a stop; spells and activated abilities are.
  if ((st.stack || []).some((s) => !/^(When|Whenever|At the beginning)/i.test(s.description || ""))) return false;
  if (st.activePlayer === "you" && st.turn > auto.armedTurn && (st.phase === "MAIN1" || st.phase === "MAIN2")) return false;
  return !!d.options.find((o) => o.type === "pass" || /^Button: OK$/i.test(o.label));
}
function setAuto(on) {
  auto = on ? { armedTurn: (cur && cur.state && cur.state.turn) || 0 } : null;
  const b = $("auto"); b.textContent = auto ? "⏹ Detener (pasando hasta tu turno)" : "⏭ Pasar hasta mi turno"; b.classList.toggle("on", !!auto);
  if (auto && cur && autoPassable(cur)) { const pass = cur.options.find((o) => o.type === "pass" || /^Button: OK$/i.test(o.label)); selected = new Set([pass.id]); submit(); }
}
function showDecision(d) {
  if (d.rid === lastAnswered) return;
  cur = d; selected = new Set(); cards = d.cards || {};
  renderState(d.state);
  if (autoPassable(d)) { const pass = d.options.find((o) => o.type === "pass" || /^Button: OK$/i.test(o.label)); selected = new Set([pass.id]); setStatus("pasando hasta tu turno…"); $("prompt").textContent = `Pasando (${d.state.phase}, juega ${d.state.activePlayer === "you" ? "vos" : "el rival"})…`; return submit(); }
  if (auto) setAuto(false);
  $("decision").className = "";
  const kindLabel = { priority: "Tenés prioridad", attackers: "Declarar atacantes", blockers: "Declarar bloqueadores", targets: "Elegir objetivo", mana_payment: "Pagar maná", mulligan: "¿Mulligan?", london_bottom: "Cartas al fondo", play_draw: "¿Salir o robar?", choose_cards: "Elegir cartas", discard: "Descartar", order_triggers: "Ordenar disparos", scry: "Adivinar", surveil: "Vigilar", confirm: "Confirmar", choose_number: "Elegir número", choose_ability: "Elegir habilidad", choose_entity: "Elegir", assign_damage: "Asignar daño" }[d.kind] || d.kind;
  $("prompt").innerHTML = `<b>${esc(kindLabel)}</b> — ${esc(d.prompt)}`;
  setStatus("TE TOCA DECIDIR", true);
  const opts = $("opts"); opts.innerHTML = "";
  for (const o of d.options) {
    const b = document.createElement("button");
    b.textContent = o.label.replace(/^Button: /, ""); b.dataset.id = o.id;
    if (o.type === "pass" || /^pass\b/i.test(o.label)) b.classList.add("pass");
    b.onclick = () => toggle(o.id);
    opts.appendChild(b);
  }
  const go = $("go"); go.style.display = "";
  go.onclick = submit;
  $("hint").textContent = (d.min === d.max ? (d.min === 1 ? "Elegí una opción" : `Elegí ${d.min}`) : `Elegí entre ${d.min} y ${d.max}`) + " · Enter = confirmar / pasar";
  $("err").textContent = "";
  updateButtons();
  try { if (document.hidden) new Notification("mtg-rival: te toca"); } catch {}
}
function toggle(id) {
  if (!cur) return;
  if (cur.max === 1) { selected = selected.has(id) ? new Set() : new Set([id]); if (cur.min === 1 && selected.size === 1) return submit(); }
  else if (selected.has(id)) selected.delete(id);
  else if (selected.size < cur.max) selected.add(id);
  updateButtons();
}
function updateButtons() {
  for (const b of $("opts").children) b.classList.toggle("sel", selected.has(b.dataset.id));
  for (const el of document.querySelectorAll(".card.opt")) el.classList.toggle("sel", selected.has(el.dataset.opt));
  const n = selected.size;
  $("go").disabled = !cur || n < cur.min || n > cur.max;
  $("go").textContent = n === 0 && cur && cur.min === 0 ? (cur.kind === "blockers" ? "No bloquear" : cur.kind === "attackers" ? "No atacar" : "Confirmar (nada)") : `Confirmar (${n})`;
}
async function submit() {
  if (!cur) return;
  const rid = cur.rid, body = { rid, choice: [...selected] };
  const r = await fetch(`/answer?t=${encodeURIComponent(token)}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(() => ({ error: r.statusText })); if (cur && cur.rid === rid) $("err").textContent = e.error || "error"; return; }
  lastAnswered = rid;
  // The next decision may have arrived over SSE while the POST was in flight: never wipe it.
  if (cur && cur.rid === rid) { cur = null; idle(auto ? "Pasando hasta tu turno…" : "Enviado. El rival está jugando…"); }
}
// Belt and braces: if we think nothing is pending but the server does (a missed event), pick it up.
setInterval(async () => {
  if (cur) return;
  try { const d = await (await fetch(`/pending?t=${encodeURIComponent(token)}`)).json(); if (d && d.rid && d.rid !== lastAnswered) showDecision(d); } catch {}
}, 4000);

function cardEl(c, zone) {
  const el = document.createElement("div");
  el.className = "card" + (c.tapped ? " tapped" : "") + (c.attacking ? " attacking" : "");
  const name = c.name || c;
  const info = cards[name] || {};
  const img = document.createElement("img"); img.loading = "lazy"; img.alt = name;
  img.src = `/img?name=${encodeURIComponent(name)}`;
  const ph = document.createElement("div"); ph.className = "ph"; ph.innerHTML = `<b>${esc(name)}</b>${esc(c.text || info.oracle || "")}`;
  img.onerror = () => { img.replaceWith(ph); };
  el.appendChild(img);
  if (c.pt) { const pt = document.createElement("div"); pt.className = "pt"; pt.textContent = c.pt; el.appendChild(pt); }
  if (c.summoningSick) { const b = document.createElement("div"); b.className = "badge"; b.textContent = "mareo"; el.appendChild(b); }
  const tip = document.createElement("div"); tip.className = "tip";
  tip.textContent = `${name}${info.manaCost ? "  " + info.manaCost.replace(/(\w)/g, "{$1}").replace(/ /g, "") : ""}\n${info.types || ""}\n${c.text || info.oracle || ""}${c.id ? "\n[" + c.id + "]" : ""}`;
  el.appendChild(tip);
  // link card to an option whose id is the card id (targets, attackers, hand plays…)
  if (cur && c.id) {
    const o = cur.options.find((o) => o.id === c.id || o.id.startsWith(c.id + "->") || o.id.startsWith(c.id + ":") || o.id === String(c.id).replace(/^c/, ""));
    if (o) { el.classList.add("opt"); el.dataset.opt = o.id; el.onclick = () => toggle(o.id); }
  }
  return el;
}
function renderState(st) {
  if (!st) return;
  const ph = st.phase && st.phase !== "null" ? st.phase : "—";
  $("turn").textContent = `Turno ${st.turn ?? "?"} · ${ph} · juega ${st.activePlayer === "you" ? "vos" : "el rival"}`;
  const you = st.you || {}, opp = st.opponent || {};
  $("meLife").textContent = you.life ?? "?"; $("oppLife").textContent = opp.life ?? "?";
  $("oppCounts").innerHTML = `mano ${opp.handSize ?? "?"} · biblioteca ${opp.librarySize ?? "?"} · <span class="pile" data-pile="opp-gy">cementerio ${(opp.graveyard || []).length}</span><span class="pile" data-pile="opp-ex">exilio ${(opp.exile || []).length}</span>`;
  $("meCounts").innerHTML = `biblioteca ${you.librarySize ?? "?"} · <span class="pile" data-pile="me-gy">cementerio ${(you.graveyard || []).length}</span><span class="pile" data-pile="me-ex">exilio ${(you.exile || []).length}</span>`;
  const piles = { "opp-gy": opp.graveyard, "opp-ex": opp.exile, "me-gy": you.graveyard, "me-ex": you.exile };
  for (const el of document.querySelectorAll(".pile")) el.onclick = () => showPile(el.dataset.pile, piles[el.dataset.pile] || []);
  const fill = (id, list, zone) => { const z = $(id); z.innerHTML = ""; for (const c of list || []) z.appendChild(cardEl(c, zone)); };
  const attackingIds = new Set((st.combat || []).map((c) => c.id));
  fill("oppBf", (opp.battlefield || []).map((c) => attackingIds.has(c.id) && (st.combat.find((x) => x.id === c.id) || {}).attacking === "you" ? { ...c, attacking: "you" } : c), "opp");
  fill("meBf", you.battlefield || [], "me");
  fill("hand", you.hand || [], "hand");
  const stack = st.stack || [];
  $("stackZone").style.display = stack.length ? "" : "none";
  $("stack").innerHTML = stack.map((s) => `<div>${esc(s.controller === "you" ? "vos" : "rival")}: <b>${esc(s.source || "")}</b> — ${esc(s.description || "")}</div>`).reverse().join("");
  const log = $("log"); const lines = st.recentLog || [];
  log.innerHTML = lines.map((l) => `<div class="${/^P\d/.test(l) && st.youAre && l.startsWith(st.youAre) ? "me" : ""}">${esc(l)}</div>`).join("");
  log.scrollTop = log.scrollHeight;
}
function showPile(id, list) {
  const title = { "opp-gy": "Cementerio del rival", "opp-ex": "Exilio del rival", "me-gy": "Tu cementerio", "me-ex": "Tu exilio" }[id];
  $("dlgBody").innerHTML = `<h3>${title}</h3>` + (list.length ? `<div class="cards">${list.map((n) => `<div class="card"><img src="/img?name=${encodeURIComponent(n)}" alt="${esc(n)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:this.alt}))"></div>`).join("")}</div>` : "<p class='small'>vacío</p>");
  $("dlg").showModal();
}
document.addEventListener("keydown", (e) => {
  if (!cur || e.target.tagName === "INPUT") return;
  if (e.key === "Enter") {
    if (!$("go").disabled && selected.size) return submit();
    const pass = cur.options.find((o) => o.type === "pass" || /^Button: (OK|Keep|Play)$/i.test(o.label));
    if (pass && selected.size === 0 && cur.max >= 1) { selected = new Set([pass.id]); return submit(); }
  }
  if (e.key === "Escape") { selected = new Set(); updateButtons(); }
});
try { if (Notification.permission === "default") Notification.requestPermission(); } catch {}
connect();
</script>
</body>
</html>
