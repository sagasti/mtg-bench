# ─────────────────────────────────────────────────────────────────────────────
# mtg-bench event config. Copy to config/<name>.yaml and edit.
# Full reference: docs/AGENTS.md (seats) and docs/PROMPTS.md (knowledge).
# API keys NEVER go in this file — only the NAME of the env var holding them.
# ─────────────────────────────────────────────────────────────────────────────

event:
  name: forge-8llm                 # label for the run folder; never shown to agents
  cube: "LSVCube"   # a cube bundled with Forge (see `bench cubes`) or a path to a .dck/.txt list; never shown to agents
  pods: 1                         # independent draft pods (reseated each pod); ratings pool all pods
  seed: 42
  format: round-robin             # round-robin (7 rounds, every pair once) | swiss
  rounds: 3                       # swiss only
  gamesPerMatch: 3                # best-of-3
  packs: 3
  packSize: 15
  minDeckSize: 40
  knowledge: oracle+tools+primer  # names | oracle | oracle+tools | oracle+tools+primer
  cubeStudy: true                 # each LLM seat writes its own strategy brief before the draft
  briefMaxWords: 1000
  briefScope: all                 # draft | all (draft + deckbuild + games)
  carryNotes: true                # agents may keep a scratchpad between decisions
  promptVersion: v2               # prompts/v2/* (v2: per-game scratchpad + match notes written between games)
  maxToolCallsPerDecision: 6
  maxRetries: 3                   # re-asks after a failed answer before the decision is forfeited (null action)
  decisionTimeoutSec: 180
  maxGameTurns: 40                # draw after this many turns
  recordPrompts: true            # keep rendered prompts for review (T7)
  parallelMatches: 4              # matches in a round run concurrently
  priorityStops: smart
  manaPayment: smart

engine:
  type: forge                     # forge | mock (mock = pipeline testing only)
  forgeDir: ~/forge-src           # Forge install dir (contains res/ and forge-gui-desktop-*-jar-with-dependencies.jar)
  # forgeJar: ~/forge/forge-gui-desktop-2.0.xx-jar-with-dependencies.jar   # auto-detected if omitted
  # bridgeJar: bridge/build/mtg-bench-bridge.jar                          # default
  java: /home/linuxbrew/.linuxbrew/opt/openjdk@17/bin/java
  javaOpts: ["-Xmx3g"]
  matchTimeoutSec: 7200

outputDir: runs

# USD per 1M tokens, keyed by model id. Fill in from each provider's pricing page;
# models without an entry show "n/a" for cost (token counts are always recorded).
pricing:
  deepseek/deepseek-v4-flash: { input: 0.042, output: 0.084, cacheRead: 0.0084 }   # OpenRouter models API, 2026-10-02
  qwen/qwen3.7-flash: { input: 0.030, output: 0.130, cacheRead: 0.0060 }
  openai/gpt-oss-120b: { input: 0.037, output: 0.170, cacheRead: 0 }
  openai/gpt-5-nano: { input: 0.050, output: 0.400, cacheRead: 0.0050 }
  google/gemini-2.5-flash-lite: { input: 0.100, output: 0.400, cacheRead: 0.0100 }
  openai/gpt-6-luna: { input: 0.100, output: 0.500, cacheRead: 0.0100 }
  z-ai/glm-5.3-flash: { input: 0.150, output: 0.500, cacheRead: 0.0300 }
  mistralai/mistral-small-2603: { input: 0.150, output: 0.600, cacheRead: 0.0150 }
# All eight seats are LLMs; reasoning is disabled everywhere so output tokens stay comparable and predictable.
seats:
  - id: deepseek-flash
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { enabled: false }, provider: { order: [baidu], allow_fallbacks: false } }
  - id: qwen-flash
    provider: openrouter
    model: qwen/qwen3.7-flash
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { enabled: false } }
  - id: gpt-oss-120b
    provider: openrouter
    model: openai/gpt-oss-120b
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { effort: low } }   # this endpoint refuses to disable reasoning; lowest effort instead
  - id: gpt-5-nano
    provider: openrouter
    model: openai/gpt-5-nano
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { effort: low } }   # this endpoint refuses to disable reasoning; lowest effort instead
  - id: gemini-flash-lite
    provider: openrouter
    model: google/gemini-2.5-flash-lite
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { enabled: false } }
  - id: gpt-6-luna
    provider: openrouter
    model: openai/gpt-6-luna
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { enabled: false } }
  - id: glm-flash
    provider: openrouter
    model: z-ai/glm-5.3-flash
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { effort: low } }   # this endpoint refuses to disable reasoning; lowest effort instead
  - id: mistral-small
    provider: openrouter
    model: mistralai/mistral-small-2603
    apiKeyEnv: OPENROUTER_API_KEY
    maxTokens: 2048
    extraBody: { reasoning: { enabled: false } }
